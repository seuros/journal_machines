description = "Bounded log segment metadata: roll decisions, compaction candidates, and pin-gated reclamation"
readme = "README.md"
exclude = ["src/**/tests.rs", "src/tests/", "tests/"]
keywords = ["journal", "segment", "compaction", "retention", "no-std"]
